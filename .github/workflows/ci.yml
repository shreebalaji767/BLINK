name: BLINK CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}-${{ github.run_id }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static site
        run: |
          node --check app-social-requests.js
          node --check app.js
          node tests/verify-static.mjs
          node tests/verify-social-interactions.mjs
          test -s index.html
          test -s styles.css
          grep -Fq 'app-social-requests.js' index.html
          grep -q 'styles.css' index.html
          echo "BLINK static-site validation passed."
